services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: malvinas
      POSTGRES_USER: malvinas
      POSTGRES_PASSWORD: malvinas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malvinas -d malvinas"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://malvinas:malvinas@db:5432/malvinas
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh /app/docker-entrypoint.sh

volumes:
  pgdata:
